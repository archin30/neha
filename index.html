  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(135deg, #FFB6C1, #FFD700);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      padding-bottom: 100px;
    }

    .intro-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.8);
      z-index: 1000;
      flex-direction: column;
    }

    .intro-button {
      padding: 20px 40px;
      font-size: 24px;
      background-color: #FF69B4;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    .intro-button:hover {
      background-color: #FF1493;
    }

    .greeting-card {
      display: none;
      background-color: #ffecb3;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      opacity: 0;
      animation: fadeInGreetingCard 2s ease-out forwards;
    }

    @keyframes fadeInGreetingCard {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-size: 3rem;
      color: #FF6347;
      margin-bottom: 10px;
    }

    .message {
      font-size: 1.5rem;
      color: #333;
      margin-top: 20px;
    }

    .timer {
      font-size: 1.5rem;
      color: #FF6347;
      font-weight: bold;
    }

    #next-button {
      display: none;
      padding: 15px 30px;
      font-size: 20px;
      background-color: #FF69B4;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
      margin-top: 20px;
    }

    #next-button:hover {
      background-color: #FF1493;
    }

    /* Slideshow */
    #slideshow {
      display: none;
      width: 100%;
      height: 400px;
      margin-top: 40px;
    }

    #slideshow img {
  display: none;
  max-width: 100%;
  height: auto;
  animation: fadeInOut 1s ease-in-out;
}

    @keyframes fadeInOut {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.7);
      border: none;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      font-size: 24px;
      z-index: 999;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 500;
      pointer-events: none;
    }

    .confetti div {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #FFD700;
      animation: confettiFall 5s infinite ease-in-out;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

  </style>

  <!-- Script -->
  <script>
    const introScreen = document.getElementById('intro-screen');
    const enterButton = document.getElementById('enter-button');
    const greetingCard = document.getElementById('greeting-card');
    const nextButton = document.getElementById('next-button');
    const slideshow = document.getElementById('slideshow');
    const images = document.querySelectorAll('#slideshow img');
    const audio = document.getElementById('birthday-audio');
    const audioControl = document.getElementById('audio-control');
    const timerElement = document.getElementById('timer');
    const birthdayDate = new Date('May 17, 2025 00:00:00');

    function updateTimer() {
      const currentTime = new Date();
      const timeDifference = birthdayDate - currentTime;
      if (timeDifference <= 0) {
        clearInterval(timerInterval);
        introScreen.style.display = 'none';
        greetingCard.style.display = 'block';
        nextButton.style.display = 'block'; // Show next button after greeting
        audio.play();
      } else {
        const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);
        timerElement.textContent = `Time Left: ${days}d ${hours}h ${minutes}m ${seconds}s`;
      }
    }

    const timerInterval = setInterval(updateTimer, 1000);

    enterButton.addEventListener('click', () => {
      introScreen.style.display = 'none';
      greetingCard.style.display = 'block';
      audio.play();
      nextButton.style.display = 'block';
    });

    nextButton.addEventListener('click', () => {
      nextButton.style.display = 'none';
      slideshow.style.display = 'block';

      let currentIndex = 0;
      function showNextImage() {
        images.forEach((img, index) => {
          img.style.display = 'none';
        });
        images[currentIndex].style.display = 'block';
        currentIndex = (currentIndex + 1) % images.length;
      }

      setInterval(showNextImage, 1500); // Change image every 1.5 seconds
      showNextImage(); // Initial image display
    });

    audioControl.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        audioControl.textContent = '🔊';
      } else {
        audio.pause();
        audioControl.textContent = '🔇';
      }
    });
  </script>
